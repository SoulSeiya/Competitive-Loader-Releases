name: Publicar Competitive Loader
on:
  push:
    tags: ['v*']
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Seleccionar compilador de las pruebas nativas
        shell: pwsh
        run: '"CXX=cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - name: Verificar versión y pruebas
        shell: pwsh
        run: |
          # Avoid the hosted runner's RUNNER~1 alias: resolved installation paths
          # and temporary fixture paths must refer to the same canonical folder.
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          python -m pip install -r requirements-build.txt
          if (Test-Path 'competitive_web_client.py') {
            python -m unittest tests.test_diagnostic_history tests.test_diagnostic_reports tests.test_window_chrome tests.test_profile_identity tests.test_challonge_client tests.test_challonge_shared tests.test_fresh_installation tests.test_duel_presentation tests.test_ranked_client tests.test_web_client tests.test_room_cleanup tests.test_updater tests.test_github_releases tests.test_client_updates tests.test_social_client tests.test_candidate_profile
          } else { python -m unittest discover -s tests -v }
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas' }
          $version = python -c "import competitive_loader as c; print('.'.join(map(str,c.APP_VERSION)))"
          if ('${{ github.ref_type }}' -eq 'tag' -and "v$version" -ne '${{ github.ref_name }}') {
            throw 'La etiqueta y la versión del código difieren'
          }
      - name: Construir paquete
        shell: pwsh
        run: |
          if (Test-Path 'competitive_web_client.py') {
            python -m PyInstaller --noconfirm --distpath dist-web --workpath build-web 'build_gui/Competitive Web Client.spec'
            if ($LASTEXITCODE -ne 0) { throw 'Fallo PyInstaller del cliente web' }
            New-Item -ItemType Directory -Force release | Out-Null
            Compress-Archive -Path 'dist-web/Competitive Loader.exe',licenses,README.md -DestinationPath release/CompetitiveLoader-windows-x64.zip -Force
          } else { ./build.ps1 -Python python }
      - name: Comprobar EXE
        shell: pwsh
        run: |
          if (Test-Path 'competitive_web_client.py') {
            $previousLocal=$env:LOCALAPPDATA
            try {
              $env:LOCALAPPDATA=Join-Path $env:RUNNER_TEMP 'RisingBattle-smoke'
              $p=Start-Process -FilePath './dist-web/Competitive Loader.exe' -ArgumentList '--smoke-web-client' -WindowStyle Hidden -Wait -PassThru
              if ($p.ExitCode -ne 0) { throw 'Fallo el arranque del cliente web' }
              $proof=Get-Content dist-web/web-client-smoke.json -Raw | ConvertFrom-Json
              if (-not $proof.approved_css_identical -or $proof.renderErrors.Count -gt 0 -or $proof.social_signals_fixture.overflow) { throw 'Fallo la comprobacion WebView' }
            } finally { $env:LOCALAPPDATA=$previousLocal }
          } else {
            $p=Start-Process -FilePath './dist/Competitive Loader.exe' -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw 'Fallo la apertura del EXE' }
            python tools/check_public_package.py
            if ($LASTEXITCODE -ne 0) { throw 'El paquete contiene funciones experimentales' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: CompetitiveLoader-windows-x64
          path: release/CompetitiveLoader-windows-x64.zip
      - name: Publicar Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view '${{ github.ref_name }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            $assets = gh release view '${{ github.ref_name }}' --json assets --jq '.assets[].name'
            if ($assets -contains 'CompetitiveLoader-windows-x64.zip') {
              Write-Output 'Se conserva el paquete de la Release ya verificado; no se reemplaza con una reconstruccion.'
            } else {
              gh release upload '${{ github.ref_name }}' release/CompetitiveLoader-windows-x64.zip
            }
          } else {
            gh release create '${{ github.ref_name }}' release/CompetitiveLoader-windows-x64.zip --title 'Competitive Loader ${{ github.ref_name }}' --notes-file RELEASE-NOTES.md
          }
